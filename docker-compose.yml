services:
  jnotes:
    build: .
    image: jnotes:latest
    container_name: jnotes
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Generate with: docker compose run --rm jnotes hash-password
      JNotes__PasswordHash: ${JNOTES_PASSWORD_HASH:?Set JNOTES_PASSWORD_HASH in .env}
      # Claude Desktop (MCP) access token. Generate with: docker compose run --rm jnotes generate-token
      JNotes__McpToken: ${JNOTES_MCP_TOKEN:-}
      # Lets JNotes answer ✨ /ai requests itself using your Claude subscription.
      # Create on any PC with Claude Code: `claude setup-token`, then paste into .env.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - jnotes-data:/data

  # Optional: hourly copy of backups + images to Google Drive. Set up once with
  #   docker compose run --rm --entrypoint rclone rclone config
  # (see Settings in JNotes), then start with: docker compose --profile backup up -d
  rclone:
    image: rclone/rclone:1.71.2
    container_name: jnotes-rclone
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - jnotes-data:/data
      - ./rclone:/config/rclone
      - ./deploy/rclone-sync.sh:/sync.sh:ro

volumes:
  jnotes-data:
